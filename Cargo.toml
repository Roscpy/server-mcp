[package]
name = "mcp-vps-server"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Serveur MCP léger et sécurisé pour administration système sur VPS / Termux"
repository = "https://github.com/<ton-user>/mcp-vps-server"

[[bin]]
name = "mcp-vps-server"
path = "src/main.rs"

[dependencies]
# --- SDK MCP officiel ---
# NB: vérifie les noms exacts des feature flags sur https://docs.rs/rmcp
# au moment du premier `cargo build` (l'API évolue vite, SDK encore < 1.0).
rmcp = { version = "0.16", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }

# --- Runtime async ---
tokio = { version = "1", features = ["full"] }

# --- Sérialisation / config ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# --- CLI (choix du transport au lancement) ---
clap = { version = "4", features = ["derive"] }

# --- Erreurs ---
anyhow = "1"
thiserror = "1"

# --- Logs / audit ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# --- Schéma JSON des paramètres de tools (requis par rmcp::Parameters<T>) ---
schemars = "1"

# --- Transport HTTP + auth + notifications Telegram ---
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- Phase 4: monitoring ressources système ---
sysinfo = "0.32"

[profile.release]
opt-level = "z"     # taille binaire réduite, important pour Termux
lto = true
strip = true
